<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>shattoshatto</title>

<!-- iPhone 홈 화면 앱처럼 보이게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="shattoshatto" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#F6F1E4" />

<style>
:root {
  --paper: #F6F1E4; --paper-deep: #EFE7D3; --ink: #22303A; --ink-soft: #5B6B72;
  --red: #C1443C; --blue: #2E5B8A; --gold: #C9972B; --card: #FFFDF8; --line: #DCD2BC;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--paper); font-family: -apple-system, system-ui, sans-serif; color: var(--ink); }
.af-root { display:flex; justify-content:center; }
.af-app { width:100%; max-width:480px; min-height:100dvh; background:var(--paper); display:flex; flex-direction:column; position:relative; }
.af-header { flex-shrink:0; background:var(--paper); border-bottom:1px solid var(--line); padding: calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; }
.af-brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.af-brand { display:flex; align-items:center; gap:8px; }
.af-brand-mark { color:var(--red); font-size:18px; transform:rotate(-15deg); display:inline-block; }
.af-brand-name { font-weight:700; font-size:19px; letter-spacing:-0.02em; }
.af-header-right { display:flex; align-items:center; gap:10px; }
.af-stat { display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; }
.af-stat-num { font-weight:700; font-size:18px; color:var(--red); }
.af-stat-label { font-size:10px; color:var(--ink-soft); }
.af-settings-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; }
.af-searchbar { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
.af-searchbar-icon { color:var(--ink-soft); flex-shrink:0; }
.af-searchbar-input { border:none; outline:none; background:transparent; font-size:14.5px; flex:1; font-family:inherit; color:var(--ink); }
.af-searchbar-clear { border:none; background:none; color:var(--ink-soft); cursor:pointer; display:flex; font-size:14px; }
.af-screen { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
.af-ico { display:inline-flex; align-items:center; justify-content:center; line-height:1; }
.af-spinner { display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--blue); animation:af-spin 0.8s linear infinite; vertical-align:middle; }
@keyframes af-spin { to { transform:rotate(360deg); } }
.af-scroll { flex:1; min-height:0; overflow-y:auto; padding:14px 16px 24px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.af-scroll::-webkit-scrollbar { width:5px; background:transparent; }
.af-empty { text-align:center; padding:60px 20px; color:var(--ink-soft); }
.af-empty-stamp { font-size:28px; margin-bottom:10px; color:var(--gold); }
.af-empty p { font-size:14px; line-height:1.6; }
.af-shortcut-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.af-shortcut { display:flex; flex-direction:column; align-items:flex-start; gap:10px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--red); border-radius:10px; padding:14px 12px; cursor:pointer; text-align:left; min-height:78px; }
.af-shortcut-title { font-weight:600; font-size:14.5px; line-height:1.35; color:var(--ink); }
.af-shortcut-count { font-size:11px; color:var(--ink-soft); }
.af-shortcut-new { border-left-color:var(--line); border-style:dashed; align-items:center; flex-direction:row; gap:6px; color:var(--ink-soft); justify-content:center; }
.af-shortcut-new .af-shortcut-title { font-weight:500; font-size:13px; color:var(--ink-soft); }
.af-back-row { display:flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer; font-weight:700; font-size:16px; color:var(--ink); padding:2px 0 12px; }
.af-group-body { display:flex; flex-direction:column; gap:10px; }
.af-card { display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.af-card-bar { width:3px; flex-shrink:0; background:var(--blue); }
.af-card-body { flex:1; padding:11px 13px; position:relative; }
.af-en { font-size:16px; font-weight:600; margin:0 0 4px; line-height:1.4; }
.af-ko { font-size:13.5px; color:var(--ink-soft); margin:0; line-height:1.4; }
.af-icon-btn { width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--red); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; }
.af-icon-btn-muted { color:var(--ink-soft); }
.af-card.is-editing { border-color:var(--blue); }
.af-longpressable { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.af-menu-backdrop { position:fixed; inset:0; z-index:20; background:transparent; }
.af-card-menu { position:absolute; top:8px; right:8px; z-index:21; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px rgba(34,48,58,0.16); overflow:hidden; display:flex; flex-direction:column; min-width:100px; }
.af-card-menu-item { display:flex; align-items:center; gap:6px; border:none; background:none; padding:10px 12px; font-size:13px; color:var(--ink); cursor:pointer; text-align:left; width:100%; }
.af-card-menu-item + .af-card-menu-item { border-top:1px solid var(--line); }
.af-card-menu-item-danger { color:var(--red); }
.af-card-actions { display:flex; gap:6px; margin-top:8px; }
.af-edit-en, .af-edit-ko { width:100%; border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-family:inherit; font-size:14px; resize:none; margin-bottom:6px; background:var(--paper); }
.af-edit-en { font-weight:600; }
.af-result-count { font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
.af-search-tag { font-size:10.5px; color:var(--blue); margin-bottom:4px; }
.af-add { flex:1; overflow-y:auto; padding:16px 18px 24px; display:flex; flex-direction:column; gap:4px; }
.af-field-label { font-size:12px; font-weight:700; color:var(--ink-soft); margin:10px 0 6px; display:flex; align-items:center; gap:6px; }
.af-inline-loading { display:flex; align-items:center; gap:4px; color:var(--blue); font-weight:600; font-size:11.5px; }
.af-inline-link { background:none; border:none; padding:0; color:var(--blue); text-decoration:underline; cursor:pointer; font-size:inherit; font-family:inherit; }
.af-add-en, .af-add-ko { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:14.5px; font-family:inherit; resize:none; background:var(--card); color:var(--ink); }
.af-add-en { font-weight:600; font-size:15.5px; }
.af-error-text { color:var(--red); font-size:12px; margin:4px 0 0; }
.af-situation-row { display:flex; gap:6px; }
.af-situation-select, .af-situation-input { flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink); }
.af-situation-new { border:1px dashed var(--blue); color:var(--blue); background:none; border-radius:10px; padding:8px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
.af-save-btn { margin-top:18px; background:var(--red); color:#fff; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; width:100%; }
.af-save-btn:disabled { background:var(--line); color:var(--ink-soft); }
.af-cal-header { display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px; }
.af-cal-title { font-weight:700; font-size:17px; }
.af-cal-nav { border:1px solid var(--line); background:var(--card); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; }
.af-streak { display:flex; align-items:center; gap:6px; background:#FDF3E3; border:1px solid var(--gold); color:#8A6512; border-radius:10px; padding:8px 11px; font-size:13px; margin-bottom:12px; }
.af-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.af-cal-dow { margin-bottom:4px; }
.af-cal-dow-cell { text-align:center; font-size:11.5px; color:var(--ink-soft); font-weight:700; padding-bottom:2px; }
.af-cal-cell { aspect-ratio:1; border-radius:9px; border:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative; }
.af-cal-cell-empty { border:none; background:none; }
.af-cal-cell.is-today { border-color:var(--red); border-width:1.5px; }
.af-cal-daynum { font-size:11.5px; color:var(--ink-soft); }
.af-cal-check { color:var(--red); }
.af-cal-partial { font-size:10.5px; color:var(--blue); }
.af-cal-legend { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); margin-top:14px; }
.af-tabbar { flex-shrink:0; display:grid; grid-template-columns:1fr 56px 1fr; align-items:center; border-top:1px solid var(--line); background:var(--paper); padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px); }
.af-tabbtn { display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; cursor:pointer; padding:4px 0; }
.af-tabbtn.is-active { color:var(--red); }
.af-tab-add { width:50px; height:50px; border-radius:50%; background:var(--red); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; margin:0 auto; box-shadow:0 4px 10px rgba(193,68,60,0.4); font-size:22px; }
.af-modal-backdrop { position:fixed; inset:0; background:rgba(34,48,58,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.af-modal { width:100%; max-width:480px; background:var(--paper); border-radius:18px 18px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px); }
.af-modal-title { font-weight:700; font-size:17px; margin:0 0 8px; }
.af-modal-desc { font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 12px; }
.af-modal-input { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:14px; background:var(--card); }
.af-modal-actions { display:flex; gap:8px; }
.af-modal-actions .af-save-btn { margin-top:0; }
.af-modal-cancel { border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:12px; padding:13px 18px; font-size:14px; cursor:pointer; flex:1; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  var DAILY_GOAL = 20;
  var STORAGE_KEY = "af_sentences";
  var API_KEY_STORAGE = "af_api_key";
  var TRANSLATE_MODEL = "claude-haiku-4-5-20251001";

  function todayStr(offset) {
    offset = offset || 0;
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  var SEED = [
    { id: "s1", en: "I wanna go for a green salad.", ko: "그린 샐러드 하나 할게요.", situation: "호텔 조식 카페에서", date: todayStr(-2) },
    { id: "s2", en: "What do we have today?", ko: "오늘 어떤 것 주문할거예요?", situation: "호텔 조식 카페에서", date: todayStr(-2) },
    { id: "s3", en: "I have a reservation under Kim.", ko: "김 이름으로 예약했어요.", situation: "호텔 체크인때", date: todayStr(-1) },
    { id: "s4", en: "Can I get a double-double, animal style.", ko: "더블더블 하나요, 애니멀 스타일로요.", situation: "인앤아웃에서", date: todayStr(0) }
  ];

  function loadSentences() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED)); } catch (e) {}
    return SEED.slice();
  }
  function saveSentences(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function translateToKorean(english, cb) {
    var apiKey = null;
    try { apiKey = localStorage.getItem(API_KEY_STORAGE); } catch (e) {}
    if (!apiKey) { cb({ code: "NO_API_KEY" }, null); return; }
    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: TRANSLATE_MODEL,
        max_tokens: 300,
        system: "You translate a single English sentence into natural, conversational Korean, matching casual spoken register when the English is casual. Reply with ONLY the Korean translation text, nothing else — no quotes, no explanation, no romanization.",
        messages: [{ role: "user", content: english }]
      })
    }).then(function (res) {
      if (!res.ok) { return res.json().catch(function () { return {}; }).then(function (b) { throw new Error((b.error && b.error.message) || "translate failed"); }); }
      return res.json();
    }).then(function (data) {
      var text = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("").trim();
      cb(null, text);
    }).catch(function (err) {
      cb({ code: "ERR", message: err.message }, null);
    });
  }

  // ---------------- state ----------------
  var state = {
    sentences: loadSentences(),
    tab: "home",
    selectedSituation: null,
    query: "",
    settingsOpen: false,
    editingId: null,
    editBuffer: { en: "", ko: "" },
    menuOpenId: null,
    add: { en: "", ko: "", situation: "", useCustom: false, translating: false, translateErr: null },
    calCursor: (function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })()
  };
  var addTranslateTimer = null;
  var pressTimer = null;

  function persist(next) { state.sentences = next; saveSentences(next); }
  function addSentenceRecord(entry) {
    persist([{ id: uid(), date: todayStr(0), en: entry.en, ko: entry.ko, situation: entry.situation }].concat(state.sentences));
  }
  function updateSentenceRecord(id, patch) {
    persist(state.sentences.map(function (s) { return s.id === id ? Object.assign({}, s, patch) : s; }));
  }
  function deleteSentenceRecord(id) {
    persist(state.sentences.filter(function (s) { return s.id !== id; }));
  }

  // ---------------- render ----------------
  var root = document.getElementById("root");

  function situationGroups(list) {
    var map = {};
    list.forEach(function (s) {
      if (!map[s.situation]) map[s.situation] = { count: 0, lastDate: s.date };
      map[s.situation].count++;
      if (s.date > map[s.situation].lastDate) map[s.situation].lastDate = s.date;
    });
    return Object.keys(map).map(function (k) { return [k, map[k]]; })
      .sort(function (a, b) { return a[1].lastDate < b[1].lastDate ? 1 : -1; });
  }

  function cardHTML(s) {
    var isEditing = state.editingId === s.id;
    var menuOpen = state.menuOpenId === s.id;
    if (isEditing) {
      return (
        '<div class="af-card is-editing" data-card-id="' + s.id + '">' +
          '<div class="af-card-bar"></div>' +
          '<div class="af-card-body">' +
            '<textarea class="af-edit-en" data-edit-field="en" data-id="' + s.id + '" rows="2">' + esc(state.editBuffer.en) + '</textarea>' +
            '<textarea class="af-edit-ko" data-edit-field="ko" data-id="' + s.id + '" rows="2">' + esc(state.editBuffer.ko) + '</textarea>' +
            '<div class="af-card-actions">' +
              '<button class="af-icon-btn" data-action="save-edit" data-id="' + s.id + '">✓</button>' +
              '<button class="af-icon-btn af-icon-btn-muted" data-action="cancel-edit" data-id="' + s.id + '">✕</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }
    return (
      '<div class="af-card" data-card-id="' + s.id + '">' +
        '<div class="af-card-bar"></div>' +
        '<div class="af-card-body af-press-target" data-id="' + s.id + '">' +
          '<p class="af-en af-longpressable">' + esc(s.en) + '</p>' +
          '<p class="af-ko af-longpressable">' + esc(s.ko) + '</p>' +
          (menuOpen ?
            '<div class="af-menu-backdrop" data-action="close-menu"></div>' +
            '<div class="af-card-menu">' +
              '<button class="af-card-menu-item" data-action="menu-edit" data-id="' + s.id + '">✎ 수정</button>' +
              '<button class="af-card-menu-item af-card-menu-item-danger" data-action="menu-delete" data-id="' + s.id + '">🗑 삭제</button>' +
            '</div>'
            : '') +
        '</div>' +
      '</div>'
    );
  }

  function emptyHTML(text) {
    return '<div class="af-empty"><div class="af-empty-stamp">✎</div><p>' + esc(text) + '</p></div>';
  }

  function homeScreenHTML() {
    if (state.selectedSituation) {
      var list = state.sentences.filter(function (s) { return s.situation === state.selectedSituation; });
      return (
        '<div class="af-scroll">' +
          '<button class="af-back-row" data-action="back-home">‹ ' + esc(state.selectedSituation) + '</button>' +
          '<div class="af-group-body">' + list.map(cardHTML).join("") + '</div>' +
        '</div>'
      );
    }
    var groups = situationGroups(state.sentences);
    if (groups.length === 0) {
      return '<div class="af-scroll">' + emptyHTML("아직 저장된 상황이 없어요. + 버튼으로 첫 문장을 추가해보세요.") + '</div>';
    }
    var tiles = groups.map(function (g) {
      return '<button class="af-shortcut" data-action="open-situation" data-situation="' + esc(g[0]) + '">' +
        '<span class="af-shortcut-title">' + esc(g[0]) + '</span>' +
        '<span class="af-shortcut-count">' + g[1].count + '문장</span>' +
      '</button>';
    }).join("");
    tiles += '<button class="af-shortcut af-shortcut-new" data-action="tab" data-tab="add">' +
      '<span>＋</span><span class="af-shortcut-title">새 상황 추가</span></button>';
    return '<div class="af-scroll"><div class="af-shortcut-grid">' + tiles + '</div></div>';
  }

  function searchScreenHTML() {
    var q = state.query.trim().toLowerCase();
    var results = state.sentences.filter(function (s) {
      return s.situation.toLowerCase().indexOf(q) > -1 || s.en.toLowerCase().indexOf(q) > -1 || s.ko.toLowerCase().indexOf(q) > -1;
    });
    var body = results.length === 0
      ? emptyHTML("일치하는 문장이 없어요. 다른 단어로 검색해보세요.")
      : '<div class="af-group-body">' + results.map(function (s) {
          return '<div><div class="af-search-tag">' + esc(s.situation) + '</div>' + cardHTML(s) + '</div>';
        }).join("") + '</div>';
    return '<div class="af-scroll"><div class="af-result-count">' + results.length.toLocaleString() + '개 문장</div>' + body + '</div>';
  }

  function addScreenHTML() {
    var existing = [];
    state.sentences.forEach(function (s) { if (existing.indexOf(s.situation) === -1) existing.push(s.situation); });
    if (!state.add.situation && existing.length && !state.add.useCustom) state.add.situation = existing[0];
    var useCustom = state.add.useCustom || existing.length === 0;

    var situationField = useCustom
      ? '<div class="af-situation-row">' +
          '<input class="af-situation-input" id="af-situation-custom" placeholder="예: 호텔 조식 카페에서" value="' + esc(state.add.situation) + '" />' +
          (existing.length ? '<button class="af-situation-new" data-action="situation-mode" data-mode="select">목록에서 선택</button>' : '') +
        '</div>'
      : '<div class="af-situation-row">' +
          '<select class="af-situation-select" id="af-situation-select">' +
            existing.map(function (sit) { return '<option value="' + esc(sit) + '"' + (sit === state.add.situation ? " selected" : "") + '>' + esc(sit) + '</option>'; }).join("") +
          '</select>' +
          '<button class="af-situation-new" data-action="situation-mode" data-mode="custom">+ 새 상황</button>' +
        '</div>';

    var errHTML = "";
    if (state.add.translateErr === "NO_API_KEY") {
      errHTML = '<p class="af-error-text">자동 번역을 쓰려면 <button class="af-inline-link" data-action="open-settings">설정에서 API 키를 등록</button>하세요.</p>';
    } else if (state.add.translateErr) {
      errHTML = '<p class="af-error-text">' + esc(state.add.translateErr) + '</p>';
    }

    var canSave = state.add.en.trim() && state.add.ko.trim() && state.add.situation.trim();

    return (
      '<div class="af-add">' +
        '<label class="af-field-label">영어 문장</label>' +
        '<textarea class="af-add-en" id="af-add-en" rows="2" placeholder="I wanna go for a green salad.">' + esc(state.add.en) + '</textarea>' +
        '<label class="af-field-label">한국어 번역' +
          (state.add.translating ? '<span class="af-inline-loading"><span class="af-spinner"></span> 번역 중…</span>' : '') +
        '</label>' +
        '<textarea class="af-add-ko" id="af-add-ko" rows="2" placeholder="영어를 입력하면 자동으로 번역돼요. 직접 수정도 가능해요.">' + esc(state.add.ko) + '</textarea>' +
        errHTML +
        '<label class="af-field-label">상황</label>' +
        situationField +
        '<button class="af-save-btn" id="af-save-btn" ' + (canSave ? "" : "disabled") + '>문장 저장하기</button>' +
      '</div>'
    );
  }

  function shiftMonth(c, delta) {
    var ny = c.y, nm = c.m + delta;
    if (nm < 0) { nm = 11; ny -= 1; } else if (nm > 11) { nm = 0; ny += 1; }
    return { y: ny, m: nm };
  }

  function calendarScreenHTML() {
    var countByDate = {};
    state.sentences.forEach(function (s) { countByDate[s.date] = (countByDate[s.date] || 0) + 1; });
    var y = state.calCursor.y, m = state.calCursor.m;
    var startWeekday = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < startWeekday; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(d);
    var todayIso = todayStr(0);

    var streak = 0;
    var cur = new Date();
    while (true) {
      var iso = cur.toISOString().slice(0, 10);
      if ((countByDate[iso] || 0) >= DAILY_GOAL) { streak++; cur.setDate(cur.getDate() - 1); } else break;
    }

    var dowHTML = ["일","월","화","수","목","금","토"].map(function (d2) { return '<div class="af-cal-dow-cell">' + d2 + '</div>'; }).join("");
    var cellsHTML = cells.map(function (d3) {
      if (d3 === null) return '<div class="af-cal-cell af-cal-cell-empty"></div>';
      var iso3 = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d3).padStart(2, "0");
      var count = countByDate[iso3] || 0;
      var met = count >= DAILY_GOAL;
      var isToday = iso3 === todayIso;
      var inner = met ? '<span class="af-cal-check">✓</span>' : (count > 0 ? '<span class="af-cal-partial">' + count + '</span>' : "");
      return '<div class="af-cal-cell' + (isToday ? " is-today" : "") + '"><span class="af-cal-daynum">' + d3 + '</span>' + inner + '</div>';
    }).join("");

    return (
      '<div class="af-scroll">' +
        '<div class="af-cal-header">' +
          '<button class="af-cal-nav" data-action="cal-nav" data-delta="-1">‹</button>' +
          '<span class="af-cal-title">' + y + '년 ' + (m + 1) + '월</span>' +
          '<button class="af-cal-nav" data-action="cal-nav" data-delta="1">›</button>' +
        '</div>' +
        (streak > 0 ? '<div class="af-streak">🔥<span>' + streak + '일 연속 ' + DAILY_GOAL + '문장 달성 중</span></div>' : '') +
        '<div class="af-cal-grid af-cal-dow">' + dowHTML + '</div>' +
        '<div class="af-cal-grid">' + cellsHTML + '</div>' +
        '<p class="af-cal-legend"><span class="af-cal-check">✓</span> 하루 ' + DAILY_GOAL + '문장 목표 달성</p>' +
      '</div>'
    );
  }

  function screenHTML() {
    if (state.query.trim()) return searchScreenHTML();
    if (state.tab === "home") return homeScreenHTML();
    if (state.tab === "calendar") return calendarScreenHTML();
    return addScreenHTML();
  }

  function settingsModalHTML() {
    if (!state.settingsOpen) return "";
    var key = "";
    try { key = localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) {}
    return (
      '<div class="af-modal-backdrop" data-action="close-settings">' +
        '<div class="af-modal" id="af-modal-inner">' +
          '<h3 class="af-modal-title">번역 설정</h3>' +
          '<p class="af-modal-desc">영어 문장을 자동으로 번역하려면 Anthropic API 키가 필요해요. console.anthropic.com 에서 발급받을 수 있어요. 이 키는 이 브라우저 안에만 저장돼요.</p>' +
          '<input class="af-modal-input" id="af-api-key-input" type="password" placeholder="sk-ant-..." value="' + esc(key) + '" />' +
          '<div class="af-modal-actions">' +
            '<button class="af-save-btn" data-action="save-settings">저장</button>' +
            '<button class="af-modal-cancel" data-action="close-settings">취소</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderAll() {
    var total = state.sentences.length;
    var searching = !!state.query.trim();
    root.innerHTML =
      '<div class="af-root"><div class="af-app">' +
        '<div class="af-header">' +
          '<div class="af-brand-row">' +
            '<div class="af-brand"><span class="af-brand-mark">💅</span><span class="af-brand-name">shattoshatto</span></div>' +
            '<div class="af-header-right">' +
              '<div class="af-stat"><span class="af-stat-num" id="af-stat-num">' + total.toLocaleString() + '</span><span class="af-stat-label">총 학습 문장</span></div>' +
              '<button class="af-settings-btn" data-action="open-settings">⚙</button>' +
            '</div>' +
          '</div>' +
          '<div class="af-searchbar">' +
            '<span class="af-searchbar-icon">🔍</span>' +
            '<input class="af-searchbar-input" id="af-search-input" placeholder="상황이나 단어로 검색" value="' + esc(state.query) + '" />' +
            (state.query ? '<button class="af-searchbar-clear" data-action="clear-search">✕</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="af-screen" id="af-screen">' + screenHTML() + '</div>' +
        '<nav class="af-tabbar">' +
          '<button class="af-tabbtn' + (state.tab === "home" && !searching ? " is-active" : "") + '" data-action="tab" data-tab="home"><span>🏠</span><span>홈</span></button>' +
          '<button class="af-tab-add" data-action="tab" data-tab="add">＋</button>' +
          '<button class="af-tabbtn' + (state.tab === "calendar" && !searching ? " is-active" : "") + '" data-action="tab" data-tab="calendar"><span>📅</span><span>캘린더</span></button>' +
        '</nav>' +
      '</div></div>' +
      settingsModalHTML();
    bindScreenInputs();
  }

  function renderScreenOnly() {
    document.getElementById("af-screen").innerHTML = screenHTML();
    bindScreenInputs();
  }

  // Re-attach lightweight input listeners that must NOT trigger a full re-render
  // (so the on-screen keyboard / focus / cursor position is preserved while typing).
  function bindScreenInputs() {
    var addEn = document.getElementById("af-add-en");
    if (addEn && !addEn.dataset.bound) {
      addEn.dataset.bound = "1";
      addEn.addEventListener("input", function () {
        state.add.en = addEn.value;
        clearTimeout(addTranslateTimer);
        if (!addEn.value.trim()) { setSaveDisabledLive(); return; }
        addTranslateTimer = setTimeout(function () {
          state.add.translating = true;
          state.add.translateErr = null;
          renderScreenOnly();
          translateToKorean(addEn.value.trim(), function (err, result) {
            state.add.translating = false;
            if (err) {
              state.add.translateErr = err.code === "NO_API_KEY" ? "NO_API_KEY" : "번역에 실패했어요. 직접 입력해주세요.";
            } else {
              state.add.ko = result;
            }
            renderScreenOnly();
          });
        }, 700);
      });
    }
    var addKo = document.getElementById("af-add-ko");
    if (addKo && !addKo.dataset.bound) {
      addKo.dataset.bound = "1";
      addKo.addEventListener("input", function () { state.add.ko = addKo.value; setSaveDisabledLive(); });
    }
    var situationCustom = document.getElementById("af-situation-custom");
    if (situationCustom && !situationCustom.dataset.bound) {
      situationCustom.dataset.bound = "1";
      situationCustom.addEventListener("input", function () { state.add.situation = situationCustom.value; setSaveDisabledLive(); });
    }
    var situationSelect = document.getElementById("af-situation-select");
    if (situationSelect && !situationSelect.dataset.bound) {
      situationSelect.dataset.bound = "1";
      situationSelect.addEventListener("change", function () { state.add.situation = situationSelect.value; setSaveDisabledLive(); });
    }
    var searchInput = document.getElementById("af-search-input");
    if (searchInput && !searchInput.dataset.bound) {
      searchInput.dataset.bound = "1";
      searchInput.addEventListener("input", function () {
        state.query = searchInput.value;
        renderScreenOnly();
        var bar = searchInput.parentElement;
        var existingClear = bar.querySelector('[data-action="clear-search"]');
        if (state.query && !existingClear) {
          var btn = document.createElement("button");
          btn.className = "af-searchbar-clear";
          btn.setAttribute("data-action", "clear-search");
          btn.textContent = "✕";
          bar.appendChild(btn);
        } else if (!state.query && existingClear) {
          existingClear.remove();
        }
      });
    }
    document.querySelectorAll('[data-edit-field]').forEach(function (el) {
      if (el.dataset.bound) return;
      el.dataset.bound = "1";
      el.addEventListener("input", function () {
        state.editBuffer[el.getAttribute("data-edit-field")] = el.value;
      });
    });
  }

  function setSaveDisabledLive() {
    var btn = document.getElementById("af-save-btn");
    if (!btn) return;
    var can = state.add.en.trim() && state.add.ko.trim() && state.add.situation.trim();
    btn.disabled = !can;
  }

  // ---------------- events (delegated, survive re-renders) ----------------
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "tab") {
      state.tab = el.getAttribute("data-tab");
      state.selectedSituation = null;
      state.query = "";
      if (state.tab === "add") state.add = { en: "", ko: "", situation: "", useCustom: false, translating: false, translateErr: null };
      renderAll();
    } else if (action === "open-situation") {
      state.selectedSituation = el.getAttribute("data-situation");
      renderAll();
    } else if (action === "back-home") {
      state.selectedSituation = null;
      renderAll();
    } else if (action === "clear-search") {
      state.query = "";
      renderAll();
    } else if (action === "open-settings") {
      state.settingsOpen = true;
      renderAll();
    } else if (action === "close-settings") {
      if (e.target.id === "af-modal-inner") return;
      state.settingsOpen = false;
      renderAll();
    } else if (action === "save-settings") {
      var val = document.getElementById("af-api-key-input").value.trim();
      try {
        if (val) localStorage.setItem(API_KEY_STORAGE, val);
        else localStorage.removeItem(API_KEY_STORAGE);
      } catch (e2) {}
      state.settingsOpen = false;
      renderAll();
    } else if (action === "situation-mode") {
      state.add.useCustom = el.getAttribute("data-mode") === "custom";
      renderScreenOnly();
    } else if (action === "menu-edit") {
      var id1 = el.getAttribute("data-id");
      var s1 = state.sentences.find(function (s) { return s.id === id1; });
      state.editingId = id1;
      state.editBuffer = { en: s1.en, ko: s1.ko };
      state.menuOpenId = null;
      renderAll();
    } else if (action === "menu-delete") {
      deleteSentenceRecord(el.getAttribute("data-id"));
      state.menuOpenId = null;
      renderAll();
    } else if (action === "close-menu") {
      state.menuOpenId = null;
      renderAll();
    } else if (action === "save-edit") {
      var id2 = el.getAttribute("data-id");
      updateSentenceRecord(id2, { en: state.editBuffer.en.trim(), ko: state.editBuffer.ko.trim() });
      state.editingId = null;
      renderAll();
    } else if (action === "cancel-edit") {
      state.editingId = null;
      renderAll();
    } else if (action === "cal-nav") {
      state.calCursor = shiftMonth(state.calCursor, parseInt(el.getAttribute("data-delta"), 10));
      renderScreenOnly();
    } else if (el.id === "af-save-btn") {
      // handled below (id-based, not data-action, kept simple)
    }
  });

  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "af-save-btn") {
      if (e.target.disabled) return;
      addSentenceRecord({ en: state.add.en.trim(), ko: state.add.ko.trim(), situation: state.add.situation.trim() });
      state.tab = "home";
      state.selectedSituation = null;
      state.add = { en: "", ko: "", situation: "", useCustom: false, translating: false, translateErr: null };
      renderAll();
    }
  });

  // long-press to open the edit/delete menu on a sentence card
  document.addEventListener("pointerdown", function (e) {
    var target = e.target.closest(".af-press-target");
    if (!target || state.editingId) return;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      state.menuOpenId = target.getAttribute("data-id");
      renderAll();
    }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (evt) {
    document.addEventListener(evt, function () { clearTimeout(pressTimer); });
  });
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".af-press-target")) e.preventDefault();
  });

  renderAll();
})();
</script>
</body>
</html>
