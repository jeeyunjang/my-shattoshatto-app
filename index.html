<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>shattoshatto</title>

<!-- iPhone 홈 화면 앱처럼 보이게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="shattoshatto" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#F6F1E4" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin:0; padding:0; background:#F6F1E4; }
  #root { width:100%; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const DAILY_GOAL = 20;
const STORAGE_KEY = "af_sentences";
const API_KEY_STORAGE = "af_api_key";
const TRANSLATE_MODEL = "claude-haiku-4-5-20251001";

const SEED = [
  { id: "s1", en: "I wanna go for a green salad.", ko: "그린 샐러드 하나 할게요.", situation: "호텔 조식 카페에서", date: todayStr(-2) },
  { id: "s2", en: "What do we have today?", ko: "오늘 어떤 것 주문할거예요?", situation: "호텔 조식 카페에서", date: todayStr(-2) },
  { id: "s3", en: "I have a reservation under Kim.", ko: "김 이름으로 예약했어요.", situation: "호텔 체크인때", date: todayStr(-1) },
  { id: "s4", en: "Can I get a double-double, animal style.", ko: "더블더블 하나요, 애니멀 스타일로요.", situation: "인앤아웃에서", date: todayStr(0) },
];

function todayStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}
function uid() { return Math.random().toString(36).slice(2, 10); }

function loadSentences() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED));
  return SEED;
}
function saveSentences(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}

async function translateToKorean(english) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) {
    const err = new Error("NO_API_KEY");
    err.code = "NO_API_KEY";
    throw err;
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: TRANSLATE_MODEL,
      max_tokens: 300,
      system: "You translate a single English sentence into natural, conversational Korean, matching casual spoken register when the English is casual. Reply with ONLY the Korean translation text, nothing else — no quotes, no explanation, no romanization.",
      messages: [{ role: "user", content: english }],
    }),
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    const err = new Error((errBody.error && errBody.error.message) || "translate failed");
    throw err;
  }
  const data = await res.json();
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
}

function Ico({ e, size = 16, className = "" }) {
  return <span className={"af-ico " + className} style={{ fontSize: size }} aria-hidden="true">{e}</span>;
}
function Spinner({ className = "" }) {
  return <span className={"af-spinner " + className} aria-hidden="true" />;
}

function App() {
  const [sentences, setSentences] = useState(() => loadSentences());
  const [tab, setTab] = useState("home");
  const [selectedSituation, setSelectedSituation] = useState(null);
  const [query, setQuery] = useState("");
  const [settingsOpen, setSettingsOpen] = useState(false);

  const persist = useCallback((next) => { setSentences(next); saveSentences(next); }, []);

  const addSentence = useCallback((entry) => {
    persist([{ id: uid(), date: todayStr(0), ...entry }, ...sentences]);
  }, [sentences, persist]);

  const updateSentence = useCallback((id, patch) => {
    persist(sentences.map(s => s.id === id ? { ...s, ...patch } : s));
  }, [sentences, persist]);

  const deleteSentence = useCallback((id) => {
    persist(sentences.filter(s => s.id !== id));
  }, [sentences, persist]);

  const total = sentences.length;
  const q = query.trim().toLowerCase();
  const searching = q.length > 0;

  const goTab = (t) => { setQuery(""); setSelectedSituation(null); setTab(t); };

  return (
    <div className="af-root">
      <div className="af-app">
        <div className="af-header">
          <div className="af-brand-row">
            <div className="af-brand">
              <span className="af-brand-mark">💅</span>
              <span className="af-brand-name">shattoshatto</span>
            </div>
            <div className="af-header-right">
              <div className="af-stat">
                <span className="af-stat-num">{total.toLocaleString()}</span>
                <span className="af-stat-label">총 학습 문장</span>
              </div>
              <button className="af-settings-btn" onClick={() => setSettingsOpen(true)} aria-label="설정">
                <Ico e="⚙" size={18} />
              </button>
            </div>
          </div>
          <div className="af-searchbar">
            <Ico e="🔍" size={16} className="af-searchbar-icon" />
            <input className="af-searchbar-input" placeholder="상황이나 단어로 검색"
              value={query} onChange={(e) => setQuery(e.target.value)} />
            {query && (
              <button className="af-searchbar-clear" onClick={() => setQuery("")} aria-label="지우기">
                <Ico e="✕" size={14} />
              </button>
            )}
          </div>
        </div>

        <div className="af-screen">
          {searching ? (
            <SearchResults q={q} sentences={sentences} onUpdate={updateSentence} onDelete={deleteSentence} />
          ) : tab === "home" ? (
            selectedSituation ? (
              <SituationDetail situation={selectedSituation}
                sentences={sentences.filter(s => s.situation === selectedSituation)}
                onBack={() => setSelectedSituation(null)}
                onUpdate={updateSentence} onDelete={deleteSentence} />
            ) : (
              <HomeShortcuts sentences={sentences} onOpen={setSelectedSituation} onNewSituation={() => goTab("add")} />
            )
          ) : tab === "calendar" ? (
            <CalendarScreen sentences={sentences} />
          ) : (
            <AddScreen sentences={sentences} onAdd={addSentence} onDone={() => goTab("home")} onOpenSettings={() => setSettingsOpen(true)} />
          )}
        </div>

        <nav className="af-tabbar">
          <TabBtn active={tab === "home" && !searching} onClick={() => goTab("home")} icon={<Ico e="🏠" size={20} />} label="홈" />
          <button className="af-tab-add" onClick={() => goTab("add")} aria-label="문장 추가"><Ico e="＋" size={22} /></button>
          <TabBtn active={tab === "calendar" && !searching} onClick={() => goTab("calendar")} icon={<Ico e="📅" size={20} />} label="캘린더" />
        </nav>
      </div>

      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} />}
    </div>
  );
}

function TabBtn({ active, onClick, icon, label }) {
  return (
    <button className={"af-tabbtn" + (active ? " is-active" : "")} onClick={onClick}>
      {icon}<span>{label}</span>
    </button>
  );
}

function SettingsModal({ onClose }) {
  const [key, setKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || "");
  const save = () => {
    if (key.trim()) localStorage.setItem(API_KEY_STORAGE, key.trim());
    else localStorage.removeItem(API_KEY_STORAGE);
    onClose();
  };
  return (
    <div className="af-modal-backdrop" onClick={onClose}>
      <div className="af-modal" onClick={(e) => e.stopPropagation()}>
        <h3 className="af-modal-title">번역 설정</h3>
        <p className="af-modal-desc">
          영어 문장을 자동으로 번역하려면 Anthropic API 키가 필요해요. console.anthropic.com 에서 발급받을 수 있어요.
          이 키는 이 아이폰 브라우저 안에만 저장되고 어디로도 전송되지 않아요 (번역 요청 외).
        </p>
        <input className="af-modal-input" type="password" placeholder="sk-ant-..." value={key}
          onChange={(e) => setKey(e.target.value)} />
        <div className="af-modal-actions">
          <button className="af-save-btn" onClick={save}>저장</button>
          <button className="af-modal-cancel" onClick={onClose}>취소</button>
        </div>
      </div>
    </div>
  );
}

function useScrollFade() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    let t;
    const onScroll = () => { el.classList.add("is-scrolling"); clearTimeout(t); t = setTimeout(() => el.classList.remove("is-scrolling"), 700); };
    el.addEventListener("scroll", onScroll);
    return () => { el.removeEventListener("scroll", onScroll); clearTimeout(t); };
  }, []);
  return ref;
}

function EmptyState({ text }) {
  return <div className="af-empty"><div className="af-empty-stamp">✎</div><p>{text}</p></div>;
}

function HomeShortcuts({ sentences, onOpen, onNewSituation }) {
  const scrollRef = useScrollFade();
  const map = new Map();
  for (const s of sentences) {
    if (!map.has(s.situation)) map.set(s.situation, { count: 0, lastDate: s.date });
    const entry = map.get(s.situation);
    entry.count += 1;
    if (s.date > entry.lastDate) entry.lastDate = s.date;
  }
  const situations = Array.from(map.entries()).sort((a, b) => (a[1].lastDate < b[1].lastDate ? 1 : -1));
  if (situations.length === 0) {
    return <div className="af-scroll" ref={scrollRef}><EmptyState text="아직 저장된 상황이 없어요. + 버튼으로 첫 문장을 추가해보세요." /></div>;
  }
  return (
    <div className="af-scroll" ref={scrollRef}>
      <div className="af-shortcut-grid">
        {situations.map(([situation, info]) => (
          <button key={situation} className="af-shortcut" onClick={() => onOpen(situation)}>
            <span className="af-shortcut-title">{situation}</span>
            <span className="af-shortcut-count">{info.count}문장</span>
          </button>
        ))}
        <button className="af-shortcut af-shortcut-new" onClick={onNewSituation}>
          <Ico e="＋" size={16} /><span className="af-shortcut-title">새 상황 추가</span>
        </button>
      </div>
    </div>
  );
}

function SituationDetail({ situation, sentences, onBack, onUpdate, onDelete }) {
  const scrollRef = useScrollFade();
  return (
    <div className="af-scroll" ref={scrollRef}>
      <button className="af-back-row" onClick={onBack}><Ico e="‹" size={20} /><span>{situation}</span></button>
      <div className="af-group-body">
        {sentences.map(s => <SentenceCard key={s.id} s={s} onUpdate={onUpdate} onDelete={onDelete} />)}
      </div>
    </div>
  );
}

function SearchResults({ q, sentences, onUpdate, onDelete }) {
  const scrollRef = useScrollFade();
  const results = sentences.filter(s =>
    s.situation.toLowerCase().includes(q) || s.en.toLowerCase().includes(q) || s.ko.toLowerCase().includes(q));
  return (
    <div className="af-scroll" ref={scrollRef}>
      <div className="af-result-count">{results.length.toLocaleString()}개 문장</div>
      {results.length === 0 ? <EmptyState text="일치하는 문장이 없어요. 다른 단어로 검색해보세요." /> : (
        <div className="af-group-body">
          {results.map(s => (
            <div key={s.id}>
              <div className="af-search-tag">{s.situation}</div>
              <SentenceCard s={s} onUpdate={onUpdate} onDelete={onDelete} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const LONG_PRESS_MS = 450;

function SentenceCard({ s, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [en, setEn] = useState(s.en);
  const [ko, setKo] = useState(s.ko);
  const pressTimer = useRef(null);

  useEffect(() => { setEn(s.en); setKo(s.ko); }, [s.en, s.ko]);

  const save = () => { onUpdate(s.id, { en: en.trim(), ko: ko.trim() }); setEditing(false); };
  const startPress = () => { clearTimeout(pressTimer.current); pressTimer.current = setTimeout(() => setMenuOpen(true), LONG_PRESS_MS); };
  const cancelPress = () => clearTimeout(pressTimer.current);

  return (
    <div className={"af-card" + (editing ? " is-editing" : "")}>
      <div className="af-card-bar" />
      <div className="af-card-body"
        onPointerDown={editing ? undefined : startPress}
        onPointerUp={editing ? undefined : cancelPress}
        onPointerLeave={editing ? undefined : cancelPress}
        onPointerCancel={editing ? undefined : cancelPress}
        onContextMenu={(e) => e.preventDefault()}>
        {editing ? (
          <React.Fragment>
            <textarea className="af-edit-en" value={en} onChange={(e) => setEn(e.target.value)} rows={2} />
            <textarea className="af-edit-ko" value={ko} onChange={(e) => setKo(e.target.value)} rows={2} />
            <div className="af-card-actions">
              <button className="af-icon-btn" onClick={save}><Ico e="✓" size={16} /></button>
              <button className="af-icon-btn af-icon-btn-muted" onClick={() => { setEn(s.en); setKo(s.ko); setEditing(false); }}><Ico e="✕" size={16} /></button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p className="af-en af-longpressable">{s.en}</p>
            <p className="af-ko af-longpressable">{s.ko}</p>
          </React.Fragment>
        )}
        {menuOpen && (
          <React.Fragment>
            <div className="af-menu-backdrop" onClick={() => setMenuOpen(false)} />
            <div className="af-card-menu">
              <button className="af-card-menu-item" onClick={() => { setEditing(true); setMenuOpen(false); }}><Ico e="✎" size={14} /> 수정</button>
              <button className="af-card-menu-item af-card-menu-item-danger" onClick={() => { onDelete(s.id); setMenuOpen(false); }}><Ico e="🗑" size={14} /> 삭제</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function AddScreen({ sentences, onAdd, onDone, onOpenSettings }) {
  const existingSituations = Array.from(new Set(sentences.map(s => s.situation)));
  const [en, setEn] = useState("");
  const [ko, setKo] = useState("");
  const [situation, setSituation] = useState(existingSituations[0] || "");
  const [customSituation, setCustomSituation] = useState("");
  const [useCustom, setUseCustom] = useState(existingSituations.length === 0);
  const [translating, setTranslating] = useState(false);
  const [translateErr, setTranslateErr] = useState(null);
  const debounceRef = useRef(null);

  useEffect(() => {
    clearTimeout(debounceRef.current);
    if (!en.trim()) return;
    debounceRef.current = setTimeout(async () => {
      setTranslating(true); setTranslateErr(null);
      try {
        const result = await translateToKorean(en.trim());
        setKo(result);
      } catch (e) {
        setTranslateErr(e.code === "NO_API_KEY" ? "NO_API_KEY" : "번역에 실패했어요. 직접 입력해주세요.");
      } finally { setTranslating(false); }
    }, 700);
    return () => clearTimeout(debounceRef.current);
  }, [en]);

  const finalSituation = (useCustom ? customSituation : situation).trim();
  const canSave = en.trim() && ko.trim() && finalSituation;
  const save = () => { if (!canSave) return; onAdd({ en: en.trim(), ko: ko.trim(), situation: finalSituation }); onDone(); };

  return (
    <div className="af-add">
      <label className="af-field-label">영어 문장</label>
      <textarea className="af-add-en" rows={2} placeholder="I wanna go for a green salad." value={en} onChange={(e) => setEn(e.target.value)} />
      <label className="af-field-label">
        한국어 번역
        {translating && <span className="af-inline-loading"><Spinner /> 번역 중…</span>}
      </label>
      <textarea className="af-add-ko" rows={2} placeholder="영어를 입력하면 자동으로 번역돼요. 직접 수정도 가능해요." value={ko} onChange={(e) => setKo(e.target.value)} />
      {translateErr === "NO_API_KEY" ? (
        <p className="af-error-text">자동 번역을 쓰려면 <button className="af-inline-link" onClick={onOpenSettings}>설정에서 API 키를 등록</button>하세요.</p>
      ) : translateErr ? (
        <p className="af-error-text">{translateErr}</p>
      ) : null}
      <label className="af-field-label">상황</label>
      {existingSituations.length > 0 && !useCustom ? (
        <div className="af-situation-row">
          <select className="af-situation-select" value={situation} onChange={(e) => setSituation(e.target.value)}>
            {existingSituations.map(sit => <option key={sit} value={sit}>{sit}</option>)}
          </select>
          <button className="af-situation-new" onClick={() => setUseCustom(true)}>+ 새 상황</button>
        </div>
      ) : (
        <div className="af-situation-row">
          <input className="af-situation-input" placeholder="예: 호텔 조식 카페에서" value={customSituation} onChange={(e) => setCustomSituation(e.target.value)} />
          {existingSituations.length > 0 && <button className="af-situation-new" onClick={() => setUseCustom(false)}>목록에서 선택</button>}
        </div>
      )}
      <button className="af-save-btn" disabled={!canSave} onClick={save}>문장 저장하기</button>
    </div>
  );
}

function CalendarScreen({ sentences }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const countByDate = {};
  for (const s of sentences) countByDate[s.date] = (countByDate[s.date] || 0) + 1;
  const { y, m } = cursor;
  const first = new Date(y, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const todayIso = todayStr(0);
  let streak = 0;
  { let d = new Date(); while (true) { const iso = d.toISOString().slice(0, 10); if ((countByDate[iso] || 0) >= DAILY_GOAL) { streak++; d.setDate(d.getDate() - 1); } else break; } }

  return (
    <div className="af-scroll">
      <div className="af-cal-header">
        <button className="af-cal-nav" onClick={() => setCursor(c => shiftMonth(c, -1))}><Ico e="‹" size={20} /></button>
        <span className="af-cal-title">{y}년 {m + 1}월</span>
        <button className="af-cal-nav" onClick={() => setCursor(c => shiftMonth(c, 1))}><Ico e="›" size={20} /></button>
      </div>
      {streak > 0 && <div className="af-streak"><Ico e="🔥" size={15} /><span>{streak}일 연속 {DAILY_GOAL}문장 달성 중</span></div>}
      <div className="af-cal-grid af-cal-dow">
        {["일","월","화","수","목","금","토"].map(d => <div key={d} className="af-cal-dow-cell">{d}</div>)}
      </div>
      <div className="af-cal-grid">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} className="af-cal-cell af-cal-cell-empty" />;
          const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const count = countByDate[iso] || 0;
          const met = count >= DAILY_GOAL;
          const isToday = iso === todayIso;
          return (
            <div key={i} className={"af-cal-cell" + (isToday ? " is-today" : "")}>
              <span className="af-cal-daynum">{d}</span>
              {met ? <Ico e="✓" size={13} className="af-cal-check" /> : count > 0 ? <span className="af-cal-partial">{count}</span> : null}
            </div>
          );
        })}
      </div>
      <p className="af-cal-legend"><Ico e="✓" size={12} className="af-cal-check" /> 하루 {DAILY_GOAL}문장 목표 달성</p>
    </div>
  );
}
function shiftMonth({ y, m }, delta) {
  let ny = y, nm = m + delta;
  if (nm < 0) { nm = 11; ny -= 1; } else if (nm > 11) { nm = 0; ny += 1; }
  return { y: ny, m: nm };
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<style>
:root {
  --paper: #F6F1E4; --paper-deep: #EFE7D3; --ink: #22303A; --ink-soft: #5B6B72;
  --red: #C1443C; --blue: #2E5B8A; --gold: #C9972B; --card: #FFFDF8; --line: #DCD2BC;
}
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }
html, body { background: var(--paper); font-family: 'Inter', sans-serif; color: var(--ink); }
.af-root { display:flex; justify-content:center; }
.af-app {
  width: 100%; max-width: 480px; min-height: 100dvh; background: var(--paper);
  display: flex; flex-direction: column; position: relative;
}
.af-header { flex-shrink:0; background: var(--paper); border-bottom:1px solid var(--line); padding: calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; }
.af-brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.af-brand { display:flex; align-items:center; gap:8px; }
.af-brand-mark { color:var(--red); font-size:18px; transform:rotate(-15deg); display:inline-block; }
